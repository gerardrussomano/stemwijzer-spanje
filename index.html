<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Stemwijzer Spanje: test electoral para las elecciones generales del 29 de noviembre de 2026. 33 afirmaciones, 26 candidaturas, en español, neerlandés e inglés.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Stemwijzer Spanje</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a single ballot-paper column; statement card on top, answer row below, results as a ranked tally sheet. */
:root{
  --bg:#eef0f3;
  --paper:#ffffff;
  --ink:#16203a;
  --muted:#5b6478;
  --line:#d5d9e2;
  --accent:#b3122e;          /* rojo hemiciclo */
  --accent-ink:#ffffff;
  --gold:#d9a400;            /* gualda */
  --senate:#efe4cc;          /* papeleta sepia del Senado */
  --agree:#1f7a4d;
  --disagree:#b3122e;
  --neutral:#8a8f9c;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1422;--paper:#182033;--ink:#e8ebf2;--muted:#9aa3b8;--line:#2c3650;
  --accent:#ef4d62;--accent-ink:#13182a;--gold:#f0c23a;--senate:#3a3326;
  --agree:#4cc68a;--disagree:#ef4d62;--neutral:#8b93a7;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1422;--paper:#182033;--ink:#e8ebf2;--muted:#9aa3b8;--line:#2c3650;
  --accent:#ef4d62;--accent-ink:#13182a;--gold:#f0c23a;--senate:#3a3326;
  --agree:#4cc68a;--disagree:#ef4d62;--neutral:#8b93a7;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:820px;margin:0 auto}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.05}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.flag{height:6px;background:linear-gradient(var(--accent) 0 33%,var(--gold) 33% 67%,var(--accent) 67%);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)))}

header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:2px}
.brand b{font-family:var(--display);font-variation-settings:"wdth" 125;font-weight:900;font-size:22px;letter-spacing:-.01em}
.brand b span{color:var(--accent)}
.brand small{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--paper)}
.lang button{border:0;background:none;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* Intro */
.hero{display:grid;gap:18px;padding-block:28px 8px}
.hero h1{font-size:clamp(40px,8vw,76px);font-weight:900;font-variation-settings:"wdth" 112;letter-spacing:-.02em}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{max-width:60ch;color:var(--muted);margin:0;font-size:17px}
.facts{display:flex;flex-wrap:wrap;gap:8px 18px;font-family:var(--mono);font-size:13px;color:var(--ink)}
.facts span{display:flex;gap:6px;align-items:baseline}
.facts span i{font-style:normal;color:var(--muted)}
.cta{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:6px;padding:14px 22px;font-weight:600;font-size:16px;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.btn:hover{filter:brightness(1.07)}
.regionpick{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
select{font:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);max-width:100%}

.section-label{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:34px 0 12px}
.partygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.pchip{display:flex;gap:10px;align-items:flex-start;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:10px 12px;min-width:0}
.pchip .sw{flex:0 0 10px;height:34px;border-radius:2px}
.pchip div{min-width:0}
.pchip strong{display:block;font-size:14px;line-height:1.25}
.pchip small{display:block;color:var(--muted);font-size:12px;line-height:1.35}
.note{font-size:13px;color:var(--muted);max-width:68ch}
.pchip small.nleq{color:var(--ink);margin-top:3px}
.nlb{display:inline-block;font-family:var(--mono);font-size:10px;line-height:1;padding:2px 4px;border-radius:2px;background:#ae1c28;color:#fff;vertical-align:1px;letter-spacing:.04em}
.pod small.nleq{display:block;margin-top:8px;font-size:12px;color:var(--muted)}

/* Question */
.progress{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:3px;margin-top:14px}
.progress button{height:8px;border:0;border-radius:2px;background:var(--line);padding:0}
.progress button.done{background:var(--ink)}
.progress button.skip{background:var(--gold)}
.progress button.cur{background:var(--accent)}
.qmeta{display:flex;justify-content:space-between;gap:12px;margin-top:22px;font-family:var(--mono);font-size:13px;color:var(--muted);flex-wrap:wrap}
.qmeta .topic{color:var(--accent);text-transform:uppercase;letter-spacing:.07em}
.ballot{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:clamp(22px,5vw,44px);margin-top:12px;position:relative}
.ballot::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--ink);border-radius:4px 4px 0 0}
.ballot h2{font-size:clamp(24px,4.4vw,36px);font-weight:800;font-variation-settings:"wdth" 96;letter-spacing:-.01em}
.ballot .ctx{color:var(--muted);margin:14px 0 0;max-width:62ch;font-size:15px}
.answers{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:18px}
.answers button{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:14px 6px;font-size:14px;font-weight:600;line-height:1.2;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.answers button .dot{width:16px;height:16px;border-radius:50%;border:2px solid currentColor}
.answers button[data-v="2"],.answers button[data-v="1"]{color:var(--agree)}
.answers button[data-v="-1"],.answers button[data-v="-2"]{color:var(--disagree)}
.answers button[data-v="0"]{color:var(--neutral)}
.answers button span.l{color:var(--ink)}
.answers button:hover{border-color:currentColor}
.answers button.sel{border-color:currentColor;box-shadow:inset 0 0 0 2px currentColor}
.answers button.sel .dot{background:currentColor}
@media (max-width:560px){.answers{grid-template-columns:1fr}.answers button{flex-direction:row;justify-content:flex-start;padding:12px 14px}}
.qnav{display:flex;justify-content:space-between;gap:12px;margin-top:14px;flex-wrap:wrap}
.link{background:none;border:0;padding:6px 0;color:var(--muted);font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px}
details.peek{margin-top:22px;border-top:1px solid var(--line);padding-top:12px}
details.peek summary{font-weight:600;font-size:14px;cursor:pointer;color:var(--ink)}
.peekcols{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:12px}
@media (max-width:560px){.peekcols{grid-template-columns:1fr}}
.peekcols h4{margin:0 0 6px;font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.peekcols ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:4px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 7px;border:1px solid var(--line);border-radius:3px;background:var(--bg);white-space:nowrap}
.tag i{width:8px;height:8px;border-radius:50%;display:inline-block}

/* Importance */
.implist{display:grid;gap:6px;margin-top:16px}
.imp{display:flex;gap:12px;align-items:flex-start;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:12px 14px;cursor:pointer}
.imp input{margin-top:4px;width:18px;height:18px;accent-color:var(--accent);flex:0 0 auto}
.imp div{min-width:0}
.imp small{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.imp.off{opacity:.55}
.opts{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end;margin-top:22px}

/* Results */
.resgrid{display:grid;gap:6px;margin-top:14px}
.row{background:var(--paper);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.row.out{opacity:.5}
.row > button{display:grid;grid-template-columns:30px minmax(0,1fr) 64px;gap:12px;align-items:center;width:100%;background:none;border:0;padding:12px 14px;text-align:left}
.rank{font-family:var(--mono);font-size:13px;color:var(--muted)}
.rname{display:flex;flex-direction:column;gap:6px;min-width:0}
.rname b{font-size:15px;line-height:1.2}
.rname b small{font-weight:400;color:var(--muted);font-size:12px;margin-left:6px}
.bar{height:10px;background:var(--bg);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:2px;transition:width .6s ease}
.pct{font-family:var(--display);font-variation-settings:"wdth" 100;font-weight:800;font-size:22px;text-align:right;font-variant-numeric:tabular-nums}
.detail{padding:0 14px 14px;border-top:1px solid var(--line)}
.detail p{font-size:14px;color:var(--muted);margin:12px 0}
.cmp{width:100%;border-collapse:collapse;font-size:13px}
.cmp th{text-align:left;font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 4px;border-bottom:1px solid var(--line)}
.cmp td{padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.cmp td.v{white-space:nowrap;font-weight:600}
.v2,.v1{color:var(--agree)} .vm1,.vm2{color:var(--disagree)} .v0,.vx{color:var(--neutral)}
.match{font-family:var(--mono);font-size:11px;padding:1px 5px;border-radius:3px}
.match.ok{background:color-mix(in srgb,var(--agree) 16%,transparent);color:var(--agree)}
.match.no{background:color-mix(in srgb,var(--disagree) 16%,transparent);color:var(--disagree)}
.match.mid{background:color-mix(in srgb,var(--neutral) 18%,transparent);color:var(--muted)}
.tablewrap{overflow-x:auto}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:18px}
@media (max-width:560px){.podium{grid-template-columns:1fr}}
.pod{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:16px;border-top:5px solid var(--c)}
.pod .n{font-family:var(--mono);font-size:12px;color:var(--muted)}
.pod b{display:block;font-size:17px;margin-top:4px;line-height:1.2}
.pod .big{font-family:var(--display);font-weight:900;font-size:44px;font-variation-settings:"wdth" 110;line-height:1;margin-top:10px;font-variant-numeric:tabular-nums}
.compass{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:14px;margin-top:10px}
.compass svg{width:100%;height:auto;display:block;max-width:100%}
.compass text{font-family:var(--body);fill:var(--muted)}
.filterbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:14px}
.filterbar label{display:flex;gap:6px;align-items:center}
footer{margin-top:48px;border-top:1px solid var(--line);padding-top:16px;font-size:13px;color:var(--muted)}
footer a{color:var(--ink)}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>

<div class="flag"></div>
<div class="wrap">
  <header class="top">
    <div class="brand"><b>Stemwijzer <span>Spanje</span></b><small id="sub"></small></div>
    <div class="lang" role="group" aria-label="Idioma / Language">
      <button id="lang-es" data-lang="es">ES</button><button id="lang-nl" data-lang="nl">NL</button><button id="lang-en" data-lang="en">EN</button>
    </div>
  </header>
  <main id="app"></main>
  <footer id="foot"></footer>
</div>

function score(){
  return PARTIES.map((p,pi)=>{
    let s=0,w=0;
    QUESTIONS.forEach(q=>{const u=S.answers[q.id];if(u==null)return;const wt=S.imp[q.id]?2:1;s+=wt*(1-Math.abs(u-q.pos[pi])/4);w+=wt;});
    return {p,pi,pct:w?Math.round(100*s/w):0};
  }).sort((a,b)=>b.pct-a.pct);
}
function axisPos(get){
  const f=ax=>{let s=0,n=0;for(const id in ax){const v=get(id);if(v==null)continue;s+=ax[id]*v;n++;}return n?s/n:0;};
  return {x:-f(AXES.x),y:f(AXES.y)};
}

function renderQ(){

    </div>
  </details>`;
  const next=()=>{if(S.i<n-1){S.i++;}else{S.screen="imp";}render();};
  document.querySelectorAll(".answers button").forEach(b=>b.onclick=()=>{S.answers[q.id]=+b.dataset.v;next();});

  </svg>`;
}

    const txt=`Stemwijzer Spanje · 29N\n`+shown.slice(0,5).map((r,k)=>`${k+1}. ${r.p.name}: ${r.pct}%`).join("\n");
    const ta=$("#copytext");
    const ok=()=>{$("#copy").textContent=l.copied;};
    const fb=()=>{ta.hidden=false;ta.value=txt;ta.select();};
    try{navigator.clipboard.writeText(txt).then(ok,fb);}catch(e){fb();}
  };
}

function detail(r){
  const l=L();
  const rows=QUESTIONS.map(q=>{const u=S.answers[q.id],p=q.pos[r.pi];
    let m="";if(u!=null){const d=Math.abs(u-p);m=d===0||(d===1&&u*p>0)?"ok":(u*p<0?"no":"mid");}
    return `<tr><td>${esc(tx(q.t))}${S.imp[q.id]?" ★":""}</td><td class="v ${vcls(u)}">${u==null?"—":valLabel(u)}</td><td class="v ${vcls(p)}">${valLabel(p)}</td><td>${m?`<span class="match ${m}">${l.match[m]}</span>`:""}</td></tr>`;}).join("");
  return `<div class="detail"><p>${esc(tx(r.p.d))}</p><p><strong style="color:var(--ink)">${l.dutch}:</strong> ${esc(dutchOf(r.p))}. ${l.dutchNote}</p><div class="tablewrap"><table class="cmp"><thead><tr><th>${l.cq}</th><th>${l.cy}</th><th>${l.cp}</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{S.lang=b.dataset.lang;render();});
render();
</script>
